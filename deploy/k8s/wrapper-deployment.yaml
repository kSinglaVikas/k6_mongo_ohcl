apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-wrapper
  namespace: benchmark
spec:
  replicas: 10
  selector:
    matchLabels:
      app: mongo-wrapper
  template:
    metadata:
      labels:
        app: mongo-wrapper
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongo-wrapper
          image: mongo-wrapper:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: PORT
              value: "9000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-wrapper-secrets
                  key: MONGO_URI
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mongo-wrapper-config
                  key: DB_NAME
            - name: ONED_EQ_COLLECTION
              valueFrom:
                configMapKeyRef:
                  name: mongo-wrapper-config
                  key: ONED_EQ_COLLECTION
            - name: HISTORIC_EQ_COLLECTION
              valueFrom:
                configMapKeyRef:
                  name: mongo-wrapper-config
                  key: HISTORIC_EQ_COLLECTION
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: mongo-wrapper-config
                  key: DEBUG
            - name: MAX_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: mongo-wrapper-config
                  key: MAX_POOL_SIZE
            - name: MIN_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: mongo-wrapper-config
                  key: MIN_POOL_SIZE
          startupProbe:
            httpGet:
              path: /health
              port: 9000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
